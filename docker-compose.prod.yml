# Prod: app + mongo only (без Langfuse — мало RAM на VPS).
# Образ app собирается в GitHub Actions и тянется с GHCR (см. .github/workflows/deploy-prod.yml).
# HTTPS терминирует nginx на хосте → 127.0.0.1:APP_PORT
services:
  app:
    image: ${ASTRO_IMAGE:-ghcr.io/koshaladka/astro-ai:latest}
    pull_policy: always
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      MONGODB_URI: mongodb://${MONGO_ROOT_USER:-astro}:${MONGO_ROOT_PASSWORD:-astrosecret}@mongo:27017/${MONGO_DB:-astro}?authSource=admin
    depends_on:
      mongo:
        condition: service_healthy
    ports:
      - "127.0.0.1:${APP_PORT:-4000}:3000"
    command: ["npm", "start"]

  mongo:
    image: mongo:7.0
    pull_policy: if_not_present
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER:-astro}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:-astrosecret}
      MONGO_INITDB_DATABASE: ${MONGO_DB:-astro}
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  mongo_data:
