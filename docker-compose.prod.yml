# Prod: app + mongo only (без Langfuse — мало RAM на VPS).
# Образ app собирается в GitHub Actions и тянется с GHCR (см. .github/workflows/deploy-prod.yml).
# HTTPS терминирует nginx на хосте → 127.0.0.1:APP_PORT
services:
  app:
    image: ${ASTRO_IMAGE:-ghcr.io/koshaladka/astro-ai:latest}
    # Образ уже pull'ит workflow; always ломает ручной up без docker login
    pull_policy: missing
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      MONGODB_URI: mongodb://${MONGO_ROOT_USER:-astro}:${MONGO_ROOT_PASSWORD:-astrosecret}@mongo:27017/${MONGO_DB:-astro}?authSource=admin
    depends_on:
      mongo:
        # service_healthy на 2ГБ часто ложно unhealthy (медленный mongosh) и блокирует app
        condition: service_started
    ports:
      - "127.0.0.1:${APP_PORT:-4000}:3000"
    command: ["npm", "start"]

  mongo:
    image: mongo:7.0
    pull_policy: if_not_present
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER:-astro}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:-astrosecret}
      MONGO_INITDB_DATABASE: ${MONGO_DB:-astro}
    volumes:
      - mongo_data:/data/db
    healthcheck:
      # mongosh на 2ГБ медленный — короткий timeout давал ложный unhealthy
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand({ ping: 1 })"]
      interval: 10s
      timeout: 15s
      retries: 12
      start_period: 40s

volumes:
  mongo_data:
