# Сборка образа в GitHub Actions (не на VPS) → push в GHCR → SSH pull + up.
name: Deploy prod

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-prod
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: koshaladka/astro-ai

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy on VPS
        uses: appleboy/ssh-action@v1.2.2
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE_TAG: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          GHCR_USER: ${{ github.actor }}
        with:
          host: ${{ secrets.PROD_SSH_HOST }}
          username: ${{ secrets.PROD_SSH_USER }}
          key: ${{ secrets.PROD_SSH_PRIVATE_KEY }}
          envs: GHCR_TOKEN,IMAGE_TAG,GHCR_USER
          script: |
            set -euo pipefail
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            cd /opt/astro-ai
            git fetch origin main
            git checkout -B main origin/main
            export ASTRO_IMAGE="$IMAGE_TAG"
            docker pull "$ASTRO_IMAGE"
            docker tag "$ASTRO_IMAGE" ghcr.io/koshaladka/astro-ai:latest
            docker compose -f docker-compose.prod.yml up -d --pull never
            # next start на слабом VPS может подняться не за 3с
            ok=0
            for i in $(seq 1 30); do
              if curl -sfS http://127.0.0.1:4000/api/health; then
                echo
                ok=1
                break
              fi
              sleep 3
            done
            test "$ok" = 1
            git log -1 --oneline
